[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77.0.3",
  "setuptools-scm>=8",
]

[project]
name = "alchemical-benchmark-resources"
description = ""
readme = "README.md"
keywords = [ "bioinformatics", "chemistry", "science" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Open Force Field Initiative", email = "info@openforcefield.org" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dynamic = [ "version" ]
urls = { "Homepage" = "https://github.com/openforcefield/alchemical_benchmark_resources" }

[tool.setuptools]
packages = [ "alchemical_benchmark_resources" ]
include-package-data = true

[tool.setuptools.package-data]
"alchemical_benchmark_resources" = [ "submissions/*", "submissions/**/*.yml", "scripts/*.py" ]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.mypy]
files = "alchemical_benchmark_resources"
ignore_missing_imports = true
warn_unused_ignores = true
